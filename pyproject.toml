[project]
name = "report-mauto-cdsbo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.41",
]

[dependency-groups]
dev = [
    "allure-pytest-bdd>=2.16.2",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/functional"]
addopts = "-ra --alluredir=tests/functional/allure-results"
filterwarnings = ["ignore::pytest.PytestUnknownMarkWarning"]
