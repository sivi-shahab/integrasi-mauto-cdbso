name: Functional Test (BDD + Allure)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      k6_scenario:
        description: "Skenario k6 (TS-07). Stress test sebenarnya dijalankan internal, lihat tests/k6/README.md"
        type: choice
        options: [smoke, load]
        default: smoke

permissions:
  contents: write   # push report ke branch gh-pages

concurrency:
  group: functional-test-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_VERSION: "2.32.0"
  K6_IMAGE: grafana/k6:0.54.0
  K6_SCENARIO: ${{ inputs.k6_scenario || 'smoke' }}
  # Konfigurasi service. Postgres hanya hidup di job ini dan berisi data sintetis.
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: report_mauto
  API_KEY_NAME: X-API-KEY
  VALID_API_KEYS: ci-functional-test-key
  REPORT_MAUTO_API_KEY: ci-functional-test-key
  REPORT_MAUTO_BASE_URL: http://127.0.0.1:8013

jobs:
  functional-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: report_mauto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Seed database (data sintetis)
        run: uv run python tests/functional/ci/seed.py

      - name: Start service
        run: |
          nohup .venv/bin/uvicorn main:app --host 127.0.0.1 --port 8013 > uvicorn.log 2>&1 &
          for i in $(seq 30); do
            curl -sf -o /dev/null "$REPORT_MAUTO_BASE_URL/docs" && exit 0
            sleep 1
          done
          echo "Service tidak start" && cat uvicorn.log && exit 1

      - name: Run pytest-bdd (gate)
        id: pytest
        continue-on-error: true
        run: uv run pytest -m "not known_issue"

      # TS-08: isu README k6 §9 yang belum diperbaiki. Hasil tetap masuk Allure
      # (bukti before/after) tetapi tidak menggagalkan pipeline.
      - name: Run pytest-bdd (known issue, TS-08)
        if: always()
        continue-on-error: true
        run: uv run pytest -m known_issue

      # ---------------- TS-07 Performa (k6) ----------------
      - name: Run k6 (${{ env.K6_SCENARIO }})
        id: k6
        continue-on-error: true
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$PWD":/work -w /work "$K6_IMAGE" run \
            -e BASE_URL="http://127.0.0.1:8013" \
            -e API_KEY_NAME="$API_KEY_NAME" -e API_KEY="$VALID_API_KEYS" \
            -e SCENARIO="$K6_SCENARIO" -e DATA_FILE=./data.ci.csv \
            tests/k6/report_mauto_stress.js

      - name: Konversi hasil k6 ke Allure
        if: always()
        run: |
          python3 tests/k6/k6_to_allure.py tests/k6/results \
            --out tests/functional/allure-results --env "CI (GitHub Actions)"
          # hasil load/stress test internal: satu folder per fase (before-fix, after-fix-9.4, ...),
          # label Allure "Internal UAT · <fase>" ('-' diganti spasi); summary terbaru per skenario per fase
          for dir in tests/k6/published/*/; do
            phase=$(basename "$dir")
            python3 tests/k6/k6_to_allure.py "$dir" \
              --out tests/functional/allure-results --env "Internal UAT · ${phase//-/ }"
          done

      - name: Service log
        if: always()
        run: tail -n 100 uvicorn.log || true

      # ---------------- Allure report ----------------
      - uses: actions/setup-java@v5
        if: always()
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        if: always()
        run: |
          curl -sSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Ambil history report sebelumnya (trend)
        if: always()
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        if: always()
        run: |
          RESULTS=tests/functional/allure-results
          mkdir -p "$RESULTS"
          if [ -d gh-pages/history ]; then cp -r gh-pages/history "$RESULTS/history"; fi
          cat > "$RESULTS/executor.json" <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          EOF
          cat > "$RESULTS/environment.properties" <<EOF
          Branch=${{ github.head_ref || github.ref_name }}
          Commit=${{ github.sha }}
          Database=postgres:16 (data sintetis, tests/functional/ci/seed.py)
          Python=$(uv run python --version | cut -d' ' -f2)
          EOF
          allure generate "$RESULTS" -o allure-report --clean

      - name: Upload report (artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Publish ke GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          commit_message: "allure report: ${{ github.sha }}"

      - name: Job summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          s = json.loads(pathlib.Path("allure-report/widgets/summary.json").read_text())["statistic"]
          print("### Functional Test /v1/report_mauto\n")
          print("| Total | Passed | Failed | Broken | Skipped |\n|---|---|---|---|---|")
          print(f"| {s['total']} | {s['passed']} | {s['failed']} | {s['broken']} | {s['skipped']} |")
          EOF
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gagalkan job jika test gagal
        if: steps.pytest.outcome == 'failure' || steps.k6.outcome == 'failure'
        run: |
          echo "pytest: ${{ steps.pytest.outcome }}, k6: ${{ steps.k6.outcome }}"
          exit 1
